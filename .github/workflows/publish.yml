name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish iso8583-codec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      # Optional fallback for the very first release. Once trusted publishing is
      # configured on crates.io, delete this secret and the OIDC step takes over.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "iso8583-codec") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version v${version}." >&2
            exit 1
          fi

      - name: Test
        run: |
          cargo test --all-targets --all-features
          cargo test --doc --all-features

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: cargo publish -p iso8583-codec --dry-run

      - name: Authenticate with crates.io
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish -p iso8583-codec
